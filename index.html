<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MiRutina</title>
  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪🏽</text></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              900: '#0c4a6e',
              accent: '#38bdf8'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent;
      bottom: 0;
      color: transparent;
      height: auto;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: auto;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between pb-10">

  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="bg-brand-500 text-slate-950 p-2 rounded-lg font-black text-xl">💪🏽</div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white leading-none">MiRutina</h1>
        </div>
      </div>
      <button onclick="toggleView()" id="nav-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-brand-accent px-3.5 py-2 rounded-lg border border-slate-700 font-bold transition flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i>
        <span>Progresión</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full p-4 flex-1">

    <!-- VISTA PRINCIPAL: DASHBOARD -->
    <section id="view-dashboard" class="space-y-5">
      
      <!-- Selector de Fecha -->
      <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 relative shadow-sm">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          Fecha de Sesión
        </label>
        <div class="relative flex items-center bg-slate-950 border border-slate-800 rounded-xl p-3">
          <i class="fa-regular fa-calendar text-brand-accent text-lg mr-3"></i>
          <span id="date-display" class="font-medium text-slate-200 text-base">Cargando fecha...</span>
          <input type="date" id="input-date" onchange="updateDateDisplay(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
        </div>
      </div>

      <!-- Generador de Sesión -->
      <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-sm">
        <button onclick="generateRandomWorkout()" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-black py-4 rounded-xl text-base shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2 transition active:scale-[0.98]">
          <i class="fa-solid fa-dice text-lg"></i>
          <span>GENERAR SESIÓN ALEATORIA</span>
        </button>
      </div>

      <!-- Historial de Sesiones -->
      <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-sm">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Historial Reciente</h3>
          <span id="history-count" class="text-xs text-brand-accent font-bold">0 Sesiones</span>
        </div>
        <div id="history-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
          <!-- Items del historial -->
        </div>
      </div>

    </section>

    <!-- VISTA SESIÓN: DESPLIEGUE DE EJERCICIOS GENERADOS -->
    <section id="view-workout" class="hidden space-y-4">
      
      <!-- Resumen de Sesión Activa -->
      <div class="bg-slate-900 rounded-2xl p-3.5 border border-slate-800 flex justify-between items-center">
        <div>
          <span id="workout-session-title" class="text-base font-black text-brand-accent">Sesión</span>
          <p id="workout-date-title" class="text-xs text-slate-400">Fecha de hoy</p>
        </div>
        <button onclick="showDashboard()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 font-medium">
          Volver
        </button>
      </div>

      <!-- Lista Dinámica de Ejercicios -->
      <div id="workout-list" class="space-y-3.5">
        <!-- Tarjetas cargadas por JS -->
      </div>

      <!-- Finalizar Sesión -->
      <button onclick="completeWorkout()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-4 rounded-xl text-base shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 transition active:scale-[0.98] mt-6">
        <i class="fa-solid fa-circle-check text-lg"></i>
        <span>MARCAR ENTRENAMIENTO COMPLETADO</span>
      </button>

    </section>

    <!-- VISTA CONFIGURACIÓN: PROGRESIÓN -->
    <section id="view-progression" class="hidden space-y-6">
      <div class="bg-slate-900 rounded-2xl p-5 border border-slate-800 space-y-4 shadow-sm">
        <div>
          <h2 class="text-lg font-bold text-white mb-1">Ajuste de Cargas</h2>
          <p class="text-xs text-slate-400">Configura el peso asignado para los ejercicios de hombro.</p>
        </div>

        <!-- Cargas Seleccionables -->
        <div class="space-y-4 border-t border-slate-800 pt-4">
          
          <!-- Press Militar -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Press Militar</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setWeight('press', '15 kg')" id="w-press-15" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">15 kg</button>
              <button onclick="setWeight('press', '20 kg')" id="w-press-20" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">20 kg</button>
              <button onclick="setWeight('press', '25 kg')" id="w-press-25" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">25 kg</button>
            </div>
          </div>

          <!-- Elevaciones Laterales -->
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Elevaciones Laterales</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setWeight('elevaciones', '10 kg')" id="w-elev-10" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">10 kg</button>
              <button onclick="setWeight('elevaciones', '15 kg')" id="w-elev-15" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">15 kg</button>
              <button onclick="setWeight('elevaciones', '20 kg')" id="w-elev-20" class="p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-300 font-bold transition">20 kg</button>
            </div>
          </div>

        </div>

        <button onclick="showDashboard()" class="w-full mt-6 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition">
          Guardar y Volver
        </button>
      </div>
    </section>

  </main>

  <script>
    // ESTADO GENERAL DE LA APLICACIÓN
    let selectedDate = new Date().toISOString().split('T')[0];
    let currentWorkoutData = [];

    let progState = JSON.parse(localStorage.getItem('fullbody_state')) || {
      weights: {
        press: '20 kg',
        elevaciones: '10 kg'
      },
      history: [],
      lastStartLeg: '',
      usedExerciseHistory: []
    };

    function saveState() {
      localStorage.setItem('fullbody_state', JSON.stringify(progState));
    }

    // BASE DE DATOS DE EJERCICIOS CON LINKS DE YOUTUBE
    const EXERCISE_DATABASE = {
      legs: [
        { name: "Sentadilla Frontal", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/RC5XZ3Bto0k" },
        { name: "Sentadilla Frontal Elevada", load: "2 Mancuernas", url: "https://www.youtube.com/watch?v=2ynGW-Kb8Hc" },
        { name: "Sentadilla Sumo", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/PYOWcPYckvg" }
      ],
      chest: [
        { name: "Flexiones Normales", load: "Peso Corporal", url: "https://www.youtube.com/shorts/3ljNPWHv1x4", isPushup: true },
        { name: "Flexiones Declinadas", load: "Peso Corporal", url: "https://www.youtube.com/shorts/5Nm2wr3CgNA", isPushup: true },
        { name: "Flexiones Diamante", load: "Peso Corporal", url: "https://www.youtube.com/shorts/UWmWbpIeBVI", isPushup: true }
      ],
      arms: [
        { name: "Curl Bíceps", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/WrpQYs_n_Pw" },
        { name: "Curl Martillo", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/QdEY-VZcPMU" },
        { name: "Curl Concentrado", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/JM6T3kun48k" }
      ],
      shouldersTriceps: [
        { name: "Press Militar", getLoad: () => `Mancuerna ${progState.weights.press || '20 kg'}`, url: "https://www.youtube.com/shorts/i5cvgQveFbY" },
        { name: "Elevaciones Laterales", getLoad: () => `Mancuerna ${progState.weights.elevaciones || '10 kg'}`, url: "https://www.youtube.com/shorts/t9Cb4hLuGfE" },
        { name: "Copa Tríceps", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/-A7Zx67qfAc" }
      ],
      coreCalves: [
        { name: "Rueda Abdominal", load: "Peso Corporal", url: "https://www.youtube.com/shorts/lhYSUUWaFEU" },
        { name: "Pantorrillas Unilateral", load: "Mancuerna 15 kg", url: "https://www.youtube.com/shorts/fKt3Q0peC0Y" },
        { name: "Pantorrillas Bilateral", load: "2 Mancuernas", url: "https://www.youtube.com/shorts/_5W3WPS1bGU" }
      ]
    };

    // FUNCIONES AUXILIARES
    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // ESQUEMA DINÁMICO DE REPETICIONES
    function getRandomRepScheme(categoryKey, exerciseName = '', isPushup = false) {
      if (isPushup) {
        const pushupSchemes = [
          { desc: "4 series x 15 reps", intensity: "Moderado • RIR 2", rest: "60s" },
          { desc: "4 series x 20 reps", intensity: "Alto Volumen • RIR 1", rest: "60s" },
          { desc: "4 series x 25 reps", intensity: "Al Fallo • RIR 0-1", rest: "75s" }
        ];
        return getRandomItem(pushupSchemes);
      }

      // PIERNAS / SENTADILLAS: MÍNIMO 12 REPS SIEMPRE
      if (categoryKey === 'legs') {
        const legSchemes = [
          { desc: "4 series x 12 reps", intensity: "Moderado • RIR 1-2", rest: "75s" },
          { desc: "4 series x 15 reps", intensity: "Alto Volumen • RIR 1", rest: "60s" },
          { desc: "4 series x 18 reps", intensity: "Alto Volumen • RIR 1", rest: "60s" },
          { desc: "4 series x 20 reps", intensity: "Resistencia • RIR 1", rest: "60s" }
        ];
        return getRandomItem(legSchemes);
      }

      // PANTORRILLAS: ALTO VOLUMEN
      if (exerciseName.includes('Pantorrillas')) {
        const calfSchemes = [
          { desc: "4 series x 15 reps", intensity: "Moderado • RIR 1-2", rest: "60s" },
          { desc: "4 series x 20 reps", intensity: "Alto Volumen • RIR 1", rest: "60s" },
          { desc: "4 series x 25 reps", intensity: "Al Fallo • RIR 0-1", rest: "45s" }
        ];
        return getRandomItem(calfSchemes);
      }

      // HOMBROS / PRESS / ELEVACIONES: DESDE 8 REPS
      if (categoryKey === 'shouldersTriceps' || exerciseName.includes('Press') || exerciseName.includes('Elevaciones')) {
        const shoulderSchemes = [
          { desc: "4 series x 8 reps", intensity: "Pesado • RIR 1-2", rest: "60s" },
          { desc: "4 series x 10 reps", intensity: "Moderado • RIR 1-2", rest: "75s" },
          { desc: "4 series x 12 reps", intensity: "Moderado-Alto • RIR 1", rest: "75s" },
          { desc: "4 series x 15 reps", intensity: "Alto Volumen • RIR 1", rest: "90s" }
        ];
        return getRandomItem(shoulderSchemes);
      }

      // ESQUEMA ESTÁNDAR
      const standardSchemes = [
        { desc: "4 series x 10 reps", intensity: "Moderado • RIR 1-2", rest: "60s" },
        { desc: "4 series x 12 reps", intensity: "Moderado-Alto • RIR 1", rest: "60s" },
        { desc: "4 series x 15 reps", intensity: "Alto Volumen • RIR 1", rest: "60s" }
      ];
      return getRandomItem(standardSchemes);
    }

    // PREVENIR REPETICIONES EXCESIVAS
    function getNonRepeatingExercise(pool) {
      const usedInHistory = progState.usedExerciseHistory || [];
      const available = pool.filter(ex => !usedInHistory.includes(ex.name));

      if (available.length > 0) {
        return getRandomItem(available);
      }
      return getRandomItem(pool);
    }

    // GENERADOR ALEATORIO
    function generateRandomWorkout() {
      // 1. Puesto 1: Piernas
      const legPool = EXERCISE_DATABASE.legs.filter(ex => ex.name !== progState.lastStartLeg);
      const legEx = getNonRepeatingExercise(legPool.length > 0 ? legPool : EXERCISE_DATABASE.legs);

      // 2. Puestos 2, 3 y 4 VARIABLES: Pecho, Brazos, Hombro/Tríceps
      const chestEx = getNonRepeatingExercise(EXERCISE_DATABASE.chest);
      const armEx = getNonRepeatingExercise(EXERCISE_DATABASE.arms);
      const shoulderEx = getNonRepeatingExercise(EXERCISE_DATABASE.shouldersTriceps);

      const midPool = [
        { type: "Pecho", categoryKey: "chest", ex: chestEx },
        { type: "Brazos", categoryKey: "arms", ex: armEx },
        { type: "Hombro/Tríceps", categoryKey: "shouldersTriceps", ex: shoulderEx }
      ];
      const shuffledMid = shuffleArray(midPool);

      // 3. Puestos 5 y 6 VARIABLES: Core y Pantorrillas
      const endPool = [
        { type: "Core", categoryKey: "coreCalves", ex: EXERCISE_DATABASE.coreCalves[0] },
        { type: "Pantorrillas", categoryKey: "coreCalves", ex: getRandomItem([EXERCISE_DATABASE.coreCalves[1], EXERCISE_DATABASE.coreCalves[2]]) }
      ];
      const shuffledEnd = shuffleArray(endPool);

      const fullList = [
        { pos: "Puesto 1 (Piernas)", categoryKey: "legs", ex: legEx },
        { pos: `Puesto 2 (${shuffledMid[0].type})`, categoryKey: shuffledMid[0].categoryKey, ex: shuffledMid[0].ex },
        { pos: `Puesto 3 (${shuffledMid[1].type})`, categoryKey: shuffledMid[1].categoryKey, ex: shuffledMid[1].ex },
        { pos: `Puesto 4 (${shuffledMid[2].type})`, categoryKey: shuffledMid[2].categoryKey, ex: shuffledMid[2].ex },
        { pos: `Puesto 5 (${shuffledEnd[0].type})`, categoryKey: shuffledEnd[0].categoryKey, ex: shuffledEnd[0].ex },
        { pos: `Puesto 6 (${shuffledEnd[1].type})`, categoryKey: shuffledEnd[1].categoryKey, ex: shuffledEnd[1].ex }
      ];

      // Actualizar registro histórico
      const selectedNames = fullList.map(item => item.ex.name);
      progState.lastStartLeg = legEx.name;
      progState.usedExerciseHistory = [...(progState.usedExerciseHistory || []), ...selectedNames];

      if (progState.usedExerciseHistory.length > 12) {
        progState.usedExerciseHistory = selectedNames;
      }
      saveState();

      currentWorkoutData = fullList.map(item => {
        const isPushup = !!item.ex.isPushup;
        const repScheme = getRandomRepScheme(item.categoryKey, item.ex.name, isPushup);
        const load = item.ex.getLoad ? item.ex.getLoad() : item.ex.load;
        return {
          pos: item.pos,
          name: item.ex.name,
          load: load,
          url: item.ex.url,
          desc: repScheme.desc,
          intensity: repScheme.intensity,
          rest: repScheme.rest
        };
      });

      renderWorkoutView();
    }

    // OBTENER TÍTULO CON DÍA DE LA SEMANA (e.g. "Sesión Lunes")
    function getSessionTitleForDate(dateStr) {
      if (!dateStr) return "Sesión";
      const [year, month, day] = dateStr.split('-');
      const dateObj = new Date(year, month - 1, day);
      const dayName = dateObj.toLocaleDateString('es-ES', { weekday: 'long' });
      const capitalizedDay = dayName.charAt(0).toUpperCase() + dayName.slice(1);
      return `Sesión ${capitalizedDay}`;
    }

    // RENDERIZAR SESIÓN
    function renderWorkoutView() {
      const titleName = getSessionTitleForDate(selectedDate);
      document.getElementById('workout-session-title').innerText = titleName;
      document.getElementById('workout-date-title').innerText = document.getElementById('date-display').innerText;

      const container = document.getElementById('workout-list');
      container.innerHTML = '';

      currentWorkoutData.forEach((item) => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-2.5 shadow-sm";
        
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-brand-accent uppercase tracking-wider">${item.pos}</span>
            <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700 font-medium">
              <i class="fa-regular fa-clock mr-1"></i>${item.rest}
            </span>
          </div>

          <div class="flex justify-between items-start gap-2">
            <h3 class="text-base font-bold text-white leading-snug">${item.name}</h3>
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="shrink-0 inline-flex items-center gap-1.5 text-[11px] font-bold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 px-2.5 py-1 rounded-lg transition active:scale-95">
              <i class="fa-brands fa-youtube text-rose-500 text-sm"></i>
              <span>Técnica</span>
            </a>
          </div>

          <div class="text-xs text-slate-300 flex items-center gap-2 bg-slate-950/60 p-2 rounded-lg border border-slate-800/60">
            <i class="fa-solid fa-weight-hanging text-brand-500"></i>
            <span class="font-medium">${item.load}</span>
          </div>

          <div class="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
            <div class="text-slate-200 font-semibold">
              <i class="fa-solid fa-bullseye text-brand-500 mr-1.5"></i>${item.desc}
            </div>
            <span class="text-[10px] bg-brand-500/10 text-brand-accent px-2 py-0.5 rounded-full font-bold border border-brand-500/20">
              ${item.intensity}
            </span>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-progression').classList.add('hidden');
      document.getElementById('view-workout').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // COMPLETAR ENTRENAMIENTO Y GUARDAR CON DÍA DE LA SEMANA
    function completeWorkout() {
      const titleName = getSessionTitleForDate(selectedDate);

      const entry = {
        id: Date.now(),
        date: selectedDate,
        title: titleName, // Ej: "Sesión Lunes", "Sesión Miércoles", etc.
        count: currentWorkoutData.length
      };
      
      progState.history.push(entry);
      saveState();

      showDashboard();
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      const historyCount = document.getElementById('history-count');
      if (!historyList) return;

      const history = progState.history || [];
      if (historyCount) historyCount.innerText = `${history.length} Sesiones`;

      historyList.innerHTML = '';

      if (history.length === 0) {
        historyList.innerHTML = `<p class="text-xs text-slate-500 italic py-3 text-center">Sin entrenamientos registrados aún.</p>`;
        return;
      }

      const sorted = [...history].reverse();
      sorted.forEach((item) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-xs";
        
        const [year, month, day] = item.date.split('-');
        const formattedDate = new Date(year, month - 1, day).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });

        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="font-bold text-white">${item.title}</span>
            <span class="text-slate-400">• ${formattedDate}</span>
          </div>
          <button onclick="deleteHistoryEntry(${item.id})" class="text-slate-500 hover:text-rose-400 px-2 py-1">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        historyList.appendChild(row);
      });
    }

    function deleteHistoryEntry(id) {
      progState.history = progState.history.filter(item => item.id !== id);
      saveState();
      renderHistory();
    }

    // NAVEGACIÓN Y VISTAS
    function showDashboard() {
      document.getElementById('view-workout').classList.add('hidden');
      document.getElementById('view-progression').classList.add('hidden');
      document.getElementById('view-dashboard').classList.remove('hidden');
      document.getElementById('nav-btn').innerHTML = `<i class="fa-solid fa-sliders"></i><span>Progresión</span>`;
      window.scrollTo(0, 0);
    }

    function toggleView() {
      const progView = document.getElementById('view-progression');
      if (progView.classList.contains('hidden')) {
        updateProgressionView();
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-workout').classList.add('hidden');
        progView.classList.remove('hidden');
        document.getElementById('nav-btn').innerHTML = `<i class="fa-solid fa-house"></i><span>Inicio</span>`;
      } else {
        showDashboard();
      }
    }

    function setWeight(type, value) {
      progState.weights[type] = value;
      saveState();
      updateProgressionView();
    }

    function updateProgressionView() {
      ['15', '20', '25'].forEach(w => {
        const btn = document.getElementById(`w-press-${w}`);
        if (btn) btn.className = (progState.weights.press === `${w} kg`)
          ? "p-2.5 text-xs rounded-xl border border-brand-500 bg-brand-500/10 text-brand-accent font-bold"
          : "p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-400 font-bold";
      });

      ['10', '15', '20'].forEach(w => {
        const btn = document.getElementById(`w-elev-${w}`);
        if (btn) btn.className = (progState.weights.elevaciones === `${w} kg`)
          ? "p-2.5 text-xs rounded-xl border border-brand-500 bg-brand-500/10 text-brand-accent font-bold"
          : "p-2.5 text-xs rounded-xl border border-slate-800 bg-slate-950 text-slate-400 font-bold";
      });
    }

    // GESTIÓN DE FECHA
    function updateDateDisplay(val) {
      if (!val) return;
      selectedDate = val;
      const [year, month, day] = val.split('-');
      const d = new Date(year, month - 1, day);
      const options = { weekday: 'long', day: 'numeric', month: 'short' };
      document.getElementById('date-display').innerText = d.toLocaleDateString('es-ES', options);
    }

    // INICIALIZACIÓN
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('input-date');
      if (dateInput) {
        dateInput.value = today;
      }
      updateDateDisplay(today);
      renderHistory();
      updateProgressionView();
    };
  </script>
</body>
</html>
